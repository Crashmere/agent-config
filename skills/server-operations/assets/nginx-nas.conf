# NAS has authenticated LAN HTTPS and an SSH-only loopback HTTP inspector.
server {
    listen 127.0.0.1:80;
    server_name localhost;
    allow 127.0.0.1;
    deny all;
    include /etc/nginx/app-locations/*.conf;
    location / { return 404; }
}

server {
    listen 443 ssl http2 default_server;
    server_name __LAN_IPV4__;
    server_tokens off;
    ssl_certificate /etc/nas-ca/server.crt;
    ssl_certificate_key /etc/nas-ca/server.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:apps_tls:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;
    if (-f /run/server-maintenance/paused) { return 503; }
    error_page 502 503 504 = @nas_unavailable;
    include /etc/nginx/snippets/portal-auth.conf;
    include /etc/nginx/app-locations/*.conf;
    location / { return 302 /portal/; }
    location @nas_unavailable {
        auth_request off;
        default_type text/plain;
        return 503 "NAS service temporarily unavailable. Please retry later.\n";
    }
}
