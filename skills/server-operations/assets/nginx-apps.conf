# Render __PUBLIC_IPV4__ with the trusted server IP before installing.
# Obtain apps-ip with the bootstrap config first; see references/https.md.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    server_tokens off;

    location ^~ /.well-known/acme-challenge/ {
        root /var/lib/letsencrypt;
        default_type text/plain;
        try_files $uri =404;
    }
    location / { return 308 https://__PUBLIC_IPV4__$request_uri; }
}

# The destination address selects this server, not the client-supplied Host.
# Keep existing deployment checks local; public HTTP never proxies to apps.
server {
    listen 127.0.0.1:80;
    listen [::1]:80;
    server_name localhost;
    server_tokens off;
    allow 127.0.0.1;
    allow ::1;
    deny all;

    include /etc/nginx/app-locations/*.conf;
    location / { return 404; }
}

server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    http2 on;
    server_name __PUBLIC_IPV4__;
    server_tokens off;

    ssl_certificate /etc/letsencrypt/live/apps-ip/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/apps-ip/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:apps_tls:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    include /etc/nginx/app-locations/*.conf;
    location / { return 404; }
}
