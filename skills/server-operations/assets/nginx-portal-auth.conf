# Include only in the public HTTPS server after ServerPortal is installed and verified.
# ACME and the loopback-only deployment-check server must not include this file.
auth_request /_portal_device_check;
auth_request_set $portal_device_cookie $upstream_http_set_cookie;
add_header Set-Cookie $portal_device_cookie always;
error_page 401 = @portal_device_required;

location = /_portal_device_check {
    internal;
    # The parent application enforces its limit; this subrequest forwards no body.
    client_max_body_size 0;
    auth_request off;
    proxy_pass http://127.0.0.1:18085/auth/check;
    proxy_pass_request_body off;
    proxy_set_header Content-Length "";
    proxy_set_header Cookie $http_cookie;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
}

location @portal_device_required {
    auth_request off;
    rewrite ^ /auth/required break;
    proxy_pass http://127.0.0.1:18085;
    proxy_pass_request_body off;
    proxy_set_header Content-Length "";
    proxy_set_header X-Original-URI $request_uri;
    proxy_set_header Sec-Fetch-Dest $http_sec_fetch_dest;
    proxy_set_header Host $host;
}
