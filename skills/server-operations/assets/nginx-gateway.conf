# Render the public address and HTTPS port from trusted host configuration.
# vps uses 8443; its existing personal proxy retains TCP 443. ali uses 443.
server {
    listen 80 default_server;
    server_name _;
    server_tokens off;
    location ^~ /.well-known/acme-challenge/ {
        root /var/lib/letsencrypt;
        default_type text/plain;
        try_files $uri =404;
    }
    location / { return 308 https://__PUBLIC_IPV4__:__HTTPS_PORT__$request_uri; }
}

server {
    listen 127.0.0.1:80;
    server_name localhost;
    server_tokens off;
    allow 127.0.0.1;
    deny all;
    include /etc/nginx/app-locations/*.conf;
    location / { return 404; }
}

server {
    listen __HTTPS_PORT__ ssl http2 default_server;
    server_name __PUBLIC_IPV4__;
    server_tokens off;
    ssl_certificate /etc/letsencrypt/live/apps-ip/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/apps-ip/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:apps_tls:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;
    if (-f /run/server-maintenance/paused) { return 503; }
    error_page 502 503 504 = @nas_unavailable;
    include /etc/nginx/snippets/portal-auth.conf;
    include /etc/nginx/app-locations/*.conf;
    location / { return 302 /portal/; }
    location @nas_unavailable {
        auth_request off;
        default_type text/plain;
        return 503 "NAS service temporarily unavailable. Please retry later.\n";
    }
}
