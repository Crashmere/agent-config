# Temporary HTTP entry while obtaining the first certificate.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    server_tokens off;

    location ^~ /.well-known/acme-challenge/ {
        root /var/lib/letsencrypt;
        default_type text/plain;
        try_files $uri =404;
    }
    include /etc/nginx/app-locations/*.conf;
    location / { return 404; }
}
