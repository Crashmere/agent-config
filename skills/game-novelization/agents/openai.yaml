interface:
  display_name: "游戏主线小说化"
  short_description: "忠实改编游戏主线为中文小说，写作、续写与续修已有稿件，让新读者看懂并减轻攻略感，只交付正文"
  default_prompt: "使用 $game-novelization，结合攻略并以容量受控的批次完整细看我提供的视频，忠实改编主线、贴合游戏风格；以没玩过游戏的读者通读，从整体阅读效果判断写作与修订需要，减轻流程攻略感，回读时核对事实、跨章一致性并比较新旧表达，最终只交付小说正文。若我要求写入语燕，先核对首页“游戏小说”分组下该游戏的独立小说知识库，默认将章节放在库内根目录。"
