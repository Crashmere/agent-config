interface:
  display_name: "Game Story Novelization"
  short_description: "Adapt game stories into Chinese novels; write and revise"
  default_prompt: "Use $game-novelization with walkthroughs and a complete, detailed review of my videos in capacity-controlled batches to faithfully adapt the main story and match the game's style; read as someone who has never played it, judge writing and revision needs by the overall reading experience, reduce walkthrough-like narration, and check facts and cross-chapter consistency while comparing old and new expression during rereading, then deliver only the Chinese novel text. If I request saving to Yuyan, first verify the game's separate novel knowledge base under the home-page group “游戏小说” and place chapters at the knowledge-base root by default."
